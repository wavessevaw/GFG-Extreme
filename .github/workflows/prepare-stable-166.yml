name: Prepare official 1.6.6
on:
  push:
    branches: [release/stable-1.6.6]
    paths: [.github/workflows/prepare-stable-166.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete explicitly requested prereleases and their tags
        run: |
          python3 - <<'PY'
          import json, subprocess
          expected = [{"id":407917385,"tag":"v1.6.11-test.1"},{"id":407887269,"tag":"v1.6.10"},{"id":407838846,"tag":"v1.6.9"},{"id":407789715,"tag":"v1.6.7"},{"id":407739663,"tag":"v1.6.6"},{"id":405219427,"tag":"v0.0.19-governor"},{"id":405204553,"tag":"v0.0.18-governor"},{"id":405200348,"tag":"v0.0.17-governor"},{"id":405028707,"tag":"v0.0.16-governor"},{"id":405015244,"tag":"v0.0.15-governor"},{"id":405008419,"tag":"v0.0.14-governor"},{"id":405002480,"tag":"v0.0.13-governor"},{"id":404996968,"tag":"v0.0.12-governor"},{"id":404991543,"tag":"v0.0.11-governor"},{"id":404985638,"tag":"v0.0.10-governor"},{"id":404975001,"tag":"v0.0.9-governor"},{"id":404772763,"tag":"v0.0.8-governor"},{"id":404706734,"tag":"v0.0.7-governor"},{"id":404692108,"tag":"v0.0.6-governor"},{"id":404636160,"tag":"v0.0.5-governor"},{"id":404507256,"tag":"v0.0.4-governor"},{"id":404409938,"tag":"v0.0.2-governor"}]
          for entry in expected:
              release = json.loads(subprocess.check_output(["gh", "api", "repos/wavessevaw/GFG-Extreme/releases/" + str(entry["id"])]))
              assert release["prerelease"] is True and release["tag_name"] == entry["tag"], entry
              subprocess.run(["gh", "release", "delete", entry["tag"], "--yes", "--cleanup-tag"], check=True)
              print("Deleted prerelease:", entry["tag"], flush=True)
          print("Deleted", len(expected), "prereleases; stable releases preserved.")
          PY
      - name: Inventory retired generator integration
        run: |
          rg -n 'open_frame_generation|GFG_OPEN|gfg-open|GFG Open' --glob '!dist/**' --glob '!engine/gfg-open/**' --glob '!RELEASE_DESCRIPTION*' --glob '!.github/workflows/prepare-stable-166.yml' || true
