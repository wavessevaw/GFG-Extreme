name: Release

# GFG Extreme 3.x: a version tag (v3.0.0) pushed, or a release created on github.com together
# with its tag, builds the Decky zip with the KEDAVRA Gamescope runtime and publishes it with
# the notes in RELEASE_DESCRIPTION_V<version>.md. "gfgPrerelease": true in package.json marks
# it a pre-release. Run by hand with a tag to build the branch it was started on and publish it
# to that tag's release; a tag that does not exist yet is created at that commit.
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish to (e.g. v3.0.1); created at this commit when new. Empty = test build: the zip is kept as a workflow artifact, nothing is published'
        required: false
        default: ''
      kedavra_sha:
        description: 'Test build only: GSF Kedavra commit to bundle instead of the pinned one'
        required: false
        default: ''

permissions:
  contents: read

env:
  # GSF Kedavra (KEDAVRA engine and Gamescope patch) at the commit this release was tested with.
  KEDAVRA_REPO: wavessevaw/GSF_Kedavra
  KEDAVRA_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.kedavra_sha != '') && inputs.kedavra_sha || 'f13e66cee6b0934d9b90a273e78253502ba64042' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m sandbox.run
      - run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js
          npx playwright-core install --with-deps chromium
          node frontend/harness/smoke.mjs

  bench:
    # Built on Ubuntu 24.04, whose glibc is older than SteamOS's, so the binary runs on the Deck.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.KEDAVRA_REPO }}
          ref: ${{ env.KEDAVRA_SHA }}
      - name: Engine bench (kfg_vktest) and shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools
          make -C kedavra all
          mkdir -p deck-bench
          cp kedavra/build/kfg_vktest kedavra/build/kfg_posttest kedavra/build/*.spv deck-bench/
      - uses: actions/upload-artifact@v4
        with:
          name: kedavra-bench
          path: deck-bench

  gamescope:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Toolchain and Gamescope dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja cmake glslang vulkan-headers \
            wayland wayland-protocols libx11 libxcomposite libxdamage libxext libxfixes libxkbcommon \
            libxmu libxrender libxres libxtst libxxf86vm libxcursor libxi libdrm libinput seatd sdl2 \
            libdecor luajit libavif libcap pipewire libei hwdata lcms2 glm benchmark pixman \
            vulkan-icd-loader xcb-util-errors xcb-util-wm xorg-xwayland libdisplay-info libliftoff python patchelf
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.KEDAVRA_REPO }}
          ref: ${{ env.KEDAVRA_SHA }}
      - name: Gamescope at the pinned commit
        run: |
          pin=$(sed -n 's/^GAMESCOPE_COMMIT=//p' kedavra/gamescope/apply.sh)
          git init -q /tmp/gamescope
          git -C /tmp/gamescope remote add origin https://github.com/ValveSoftware/gamescope.git
          git -C /tmp/gamescope fetch -q --depth 1 origin "$pin"
          git -C /tmp/gamescope checkout -q FETCH_HEAD
          git -C /tmp/gamescope submodule update --init --depth 1 --recursive
      - name: Apply KEDAVRA and build
        run: |
          sh kedavra/gamescope/apply.sh /tmp/gamescope
          cd /tmp/gamescope
          # --prefix=/usr: Gamescope reads its display scripts from <prefix>/share/gamescope/scripts.
          # With the default /usr/local it never finds SteamOS's Steam Deck OLED script, so the
          # panel looks unknown and HDR is reported unsupported.
          meson setup build --prefix=/usr --buildtype=release -Dpipewire=enabled -Denable_openvr_support=false -Denable_tests=false
          ninja -C build
          nm -C build/src/gamescope | grep -c 'kfg::'
          grep -a -c '/usr/share/gamescope/scripts' build/src/gamescope
      - name: Bundle with its libraries
        run: |
          # The GFG commit in the version: Setup asks for a reinstall whenever the runtime changes.
          sh kedavra/gamescope/bundle.sh /tmp/gamescope/build gamescope-runtime "kedavra-${KEDAVRA_SHA::7}-gfg-${GITHUB_SHA::7}"
          mkdir -p gamescope-runtime/share/licenses
          cp kedavra/shaders/THIRD_PARTY.md gamescope-runtime/share/licenses/KEDAVRA-filters-THIRD_PARTY.md
          cp LICENSE.md NOTICE.md gamescope-runtime/share/licenses/ 2>/dev/null || true
      - name: Bundled runtime resolves from its install location
        run: |
          mkdir -p /var/lib/kedavra && cp -a gamescope-runtime /var/lib/kedavra/runtime
          R=/var/lib/kedavra/runtime
          $R/lib/ld-linux-x86-64.so.2 --list $R/bin/gamescope | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then exit 1; fi
          $R/bin/gamescope --version
      - uses: actions/upload-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime

  release:
    needs: [test, gamescope, bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push builds the tag; a manual run builds the commit it was started on.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime
      - uses: actions/download-artifact@v4
        with:
          name: kedavra-bench
          path: kedavra-bench
      - name: Zip for Decky
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ -n "$TAG" ]; then
            test "v$version" = "$TAG" || { echo "::error::package.json $version does not match $TAG"; exit 1; }
          else
            version="$version-test.${GITHUB_SHA::7}"  # test build: never published
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          scripts/build_release.sh "$version" gamescope-runtime out kedavra-bench
          unzip -Z1 out/*.zip | grep -Fx GFG-Extreme/runtime/bin/gamescope
          unzip -Z1 out/*.zip | grep -Fx GFG-Extreme/bin/kfg_pacing.py
          unzip -Z1 out/*.zip | grep -Fx GFG-Extreme/bench/kfg_vktest
          unzip -Z1 out/*.zip | grep -Fx GFG-Extreme/dist/index.js
          if unzip -Z1 out/*.zip | grep -qi 'mako\|lsfg\|lossless'; then echo "::error::MAKO/LSFG files in the zip"; exit 1; fi
      - name: Test build zip
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: gfg-extreme-test-build
          path: out/*.zip
      - name: Publish
        if: env.TAG != ''
        run: |
          notes="RELEASE_DESCRIPTION_V${version//./_}.md"
          pre=$(python3 -c 'import json; print("--prerelease" if json.load(open("package.json")).get("gfgPrerelease") else "")')
          title="GFG Extreme $version"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip out/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes" $pre
          else
            # A tag push or a release made on github.com: the tag exists. A manual run: the tag
            # is created at the commit that was built.
            gh release create "$TAG" out/*.zip out/SHA256SUMS.txt --title "$title" --notes-file "$notes" $pre --target "$GITHUB_SHA"
          fi
