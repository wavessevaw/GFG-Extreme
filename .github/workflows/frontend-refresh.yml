name: Refresh frontend
on:
  push:
    branches: [feature/hud-power-theme]
    paths: [frontend/src/**, .github/workflows/frontend-refresh.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hud-power-theme
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
      - name: Commit generated frontend
        run: |
          if ! git diff --quiet -- dist/index.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/index.js
            git commit -m "build: regenerate theme installer frontend"
            git push origin HEAD:feature/hud-power-theme
          fi
