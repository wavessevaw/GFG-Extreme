name: Open field investigation
on:
  push:
    branches: [fix/open-motion-smoothness-test]
    paths: [.github/workflows/open-field-investigation.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0db5a4e5eb4a24913ea53e48a4a7cd1238d40534
      - name: Inspect new original Deck recording
        run: |
          python3 - <<'PY'
          import zipfile,json,statistics,collections,hashlib
          path='agent-handoff/gfg-open-field-logs-20261009/GFG-Extreme-log-20261009-230950.zip'
          raw=open(path,'rb').read()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='b8f4fad63e6f5960ea1113c5b3fb2619ffe12fd3b6f9ef35fa7cf60b04a7c535'
          print('ARCHIVE',path,'SHA256',digest)
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              print('FILES',json.dumps([{'name':n,'size':z.getinfo(n).file_size} for n in names]))
              for n in names:
                  if n.endswith(('summary.txt','profile.json','system.json','power-sensors.json')) or '/open-performance/' in n:
                      print('FILE',n,z.read(n).decode(errors='replace')[:24000])
                  if n.endswith('plugin.log'):
                      text=z.read(n).decode(errors='replace')
                      print('PLUGIN',text[-20000:])
                  if n.endswith('timeline.jsonl'):
                      rows=[]
                      for line in z.read(n).decode(errors='replace').splitlines():
                          try: rows.append(json.loads(line))
                          except ValueError: pass
                      samples=[r for r in rows if 'state' in r]
                      print('TIMELINE count',len(samples),'states',dict(collections.Counter(r.get('state') for r in samples)))
                      for key in ('real','output','tdp','mult'):
                          vals=sorted(r[key] for r in samples if isinstance(r.get(key),(int,float)))
                          if vals: print('STAT',key,'median',statistics.median(vals),'min',vals[0],'max',vals[-1])
                      print('FIRST_LAST',json.dumps(samples[:2]+samples[-2:]))
                  if n.endswith('governor-events.jsonl'):
                      print('GOVERNOR',z.read(n).decode(errors='replace')[-12000:])
                  if n.endswith('present-diagnostics.log'):
                      lines=z.read(n).decode(errors='replace').splitlines()
                      selected=[l for l in lines if any(w in l for w in ('GFG Open:','fixed-plan','adaptive-plan','privateOrderedTransport','present-mode','ordered-acquire-quarantine','generated_frame_capacity','backend scheduling failure'))]
                      print('DIAGNOSTIC operations',dict(collections.Counter(l.split('operation=',1)[1].split()[0] for l in lines if 'operation=' in l)))
                      print('DIAGNOSTIC_SELECTED','\n'.join(selected)[-35000:])
          PY
