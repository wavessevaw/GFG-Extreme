name: CI

# Runs on every push and pull request, independent of whether a release tag exists.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: |
          python3 scripts/check_generated_config.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Frame OS engine tests (scheduler, control channel, layer on the mock Vulkan driver)
        run: |
          VULKAN_DEPS="$RUNNER_TEMP/vk" engine/gfg-pacer/tests/setup_vulkan_deps.sh
          make -C engine/gfg-pacer VULKAN_DEPS="$RUNNER_TEMP/vk" test layer abi integration ordering
      - name: HUD layer tests (overlay file, pixel conversion, layer on the mock Vulkan driver)
        run: make -C engine/gfg-hud VULKAN_DEPS="$RUNNER_TEMP/vk" test layer abi integration

      - name: Frontend build is committed and current
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js || { echo "::error::dist/index.js is stale; run npm run build and commit"; exit 1; }
      - name: Frontend smoke test
        run: |
          npx playwright install --with-deps chromium
          node frontend/harness/smoke.mjs
