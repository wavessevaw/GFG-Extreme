name: CI

# Every push and pull request: backend unit tests, the sandbox (virtual Steam Deck runs of the
# pilot, Governor, Power Split and GPU clock ceiling), the committed frontend build and its
# smoke test. Hardware numbers come only from a Steam Deck, never from here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Sandbox scenarios
        run: python3 -m sandbox.run --report "$RUNNER_TEMP/SANDBOX_REPORT.md"
      - name: Frontend build is committed and current
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js || { echo "::error::dist/index.js is stale; run npm run build and commit"; exit 1; }
      - name: Frontend smoke test
        run: |
          npx playwright-core install --with-deps chromium
          node frontend/harness/smoke.mjs
