name: CI

# Every push and pull request: backend unit tests, the sandbox (virtual Steam Deck runs of the
# pilot, Governor, Power Split and GPU clock ceiling), the committed frontend build and its
# smoke test. Hardware numbers come only from a Steam Deck, never from here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Sandbox scenarios
        if: ${{ !cancelled() }}
        run: python3 -m sandbox.run --report "$RUNNER_TEMP/SANDBOX_REPORT.md" --json "$RUNNER_TEMP/sandbox.json"
      - name: Seeded virtual Deck stress
        if: ${{ !cancelled() }}
        run: python3 -m sandbox.stress --seeds 30 --json "$RUNNER_TEMP/stress.json"
      # The current run is supplied twice: this gate checks the historical baseline against
      # this commit; the separate three-way tool supports a pinned stable run as well.
      - name: Check baseline scenario assertions
        if: always()
        run: python3 tools/compare_sandbox.py docs/baseline-3.2.2/sandbox.json "$RUNNER_TEMP/sandbox.json" "$RUNNER_TEMP/sandbox.json" --output "$RUNNER_TEMP/comparison.json"
      - name: Save simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-deck-results
          path: |
            ${{ runner.temp }}/SANDBOX_REPORT.md
            ${{ runner.temp }}/sandbox.json
            ${{ runner.temp }}/stress.json
            ${{ runner.temp }}/comparison.json
          if-no-files-found: warn
      - name: Frontend build is committed and current
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.js || { echo "::error::dist/index.js is stale; run npm run build and commit"; exit 1; }
      - name: Frontend smoke test
        if: ${{ !cancelled() }}
        run: |
          npx playwright-core install --with-deps chromium
          node frontend/harness/smoke.mjs
