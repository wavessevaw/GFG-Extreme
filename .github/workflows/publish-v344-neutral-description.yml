name: Publish neutral v3.4.4 description

on:
  push:
    branches: [main]
    paths:
      - RELEASE_DESCRIPTION_V3_4_4.md

permissions:
  contents: write

jobs:
  update_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.4.4 --notes-file RELEASE_DESCRIPTION_V3_4_4.md
