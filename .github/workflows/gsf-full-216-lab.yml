name: Experimental GSF LAB4 2.1.6 cadence fix

on:
  push:
    branches:
      - experiment/gsf-full-2.1.6-lab4-buffered-output
  pull_request:
    branches:
      - experiment/gsf-full-2.1.6-lab3-gamescope-guard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsf-lab-216-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gsf-lab:
    name: Build complete stable+GSF lab ZIP
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the current official stable integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact fixed GSF source (do not use old internal.10 binary)
        uses: actions/checkout@v4
        with:
          repository: wavessevaw/GFG-Extreme
          ref: 070ece29ab9bf936c39fc63dc0c6fb2902456af1
          path: upstream-gsf
          persist-credentials: false

      - name: Build independent internal.13 native Vulkan layer from pinned source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-12 gcc-12 make cmake libvulkan-dev glslang-tools spirv-tools
          git clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
          make -C upstream-gsf/engine/gfg-temporal -j2 all lib
          make -C upstream-gsf/engine/gfg-native ENABLE_TE=1 BUILD=build-te \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" layer frame-clock
          (cd upstream-gsf && python3 scripts/package_native_fg.py \
            --binary engine/gfg-native/build-te/libVkLayer_gfg_native.so \
            --version 0.0.0-fg3-internal.13 \
            --outdir "$GITHUB_WORKSPACE/upstream-native")
          (cd upstream-native && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json, zipfile
          path='upstream-native/GFG-Native-FG-v0_0_0-fg3-internal_13.zip'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              m=json.loads(z.read('GFG-Native-FG/MANIFEST.json'))
              assert m['source_commit']=='070ece29ab9bf936c39fc63dc0c6fb2902456af1'
              assert m['source_worktree_dirty'] is False
              assert m['hardware_acceptance'] is False
          PY

      - name: Download official v2.1.6 release (all full Decky payloads)
        run: |
          set -euo pipefail
          mkdir -p upstream-stable
          gh release download v2.1.6 --repo "$GITHUB_REPOSITORY" \
             --pattern GFG-Extreme-v2_1_6.zip \
             --pattern SHA256SUMS.txt --dir upstream-stable
          (cd upstream-stable && sha256sum --check SHA256SUMS.txt)
          unzip -tq upstream-stable/GFG-Extreme-v2_1_6.zip
          test "$(stat -c %s upstream-stable/GFG-Extreme-v2_1_6.zip)" -gt 75000000

      - name: Compose full-size LAB with opt-in native Vulkan GSF
        run: |
          set -euo pipefail
          python3 scripts/build_gsf_216_lab_zip.py \
            --stable upstream-stable/GFG-Extreme-v2_1_6.zip \
            --native upstream-native/GFG-Native-FG-v0_0_0-fg3-internal_13.zip \
            --out lab-artifacts
          (cd lab-artifacts && sha256sum --check SHA256SUMS.txt)
          python3 scripts/check_release_archive.py \
            lab-artifacts/GFG-Extreme-2.1.6-gsf.lab4.zip 2.1.6-gsf.lab4

      - name: Test the exact installed lab ZIP without a real Steam process
        run: |
          set -euo pipefail
          python3 scripts/test_gsf_216_lab_zip.py \
            lab-artifacts/GFG-Extreme-2.1.6-gsf.lab4.zip

      - name: Show package comparison
        run: |
          set -euo pipefail
          ls -lh upstream-stable/GFG-Extreme-v2_1_6.zip lab-artifacts/GFG-Extreme-2.1.6-gsf.lab4.zip
          cat lab-artifacts/SHA256SUMS.txt

      - name: Publish only as short-lived GitHub Actions artifact, NOT stable Release
        uses: actions/upload-artifact@v4
        with:
          name: GFG-Extreme-2.1.6-GSF-LAB4-FULL
          path: |
            lab-artifacts/GFG-Extreme-2.1.6-gsf.lab4.zip
            lab-artifacts/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
