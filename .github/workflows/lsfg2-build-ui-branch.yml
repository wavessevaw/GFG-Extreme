name: LSFG-VK 2.0 UI build (experimental branch)
on:
  push:
    branches:
      - feature/lsfg-vk-2-backend-20261018
    paths:
      - .github/workflows/lsfg2-build-ui-branch.yml
      - frontend/src/app.js
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsfg-vk-2-backend-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build distribution from exact PR source
        run: |
          npm ci
          npm run build
          git add -- dist/index.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(frontend): include LSFG-VK 2.0 backend controls"
            git push origin HEAD:feature/lsfg-vk-2-backend-20261018
          fi
