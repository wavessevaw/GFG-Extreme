name: Build Extreme frontend
on:
  push:
    branches: [develop/extreme-features]
    paths: ["frontend/src/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/extreme-features
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Commit generated frontend to the development branch
        run: |
          if git diff --quiet -- dist/index.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git commit -m "Build Extreme frame timing controls"
          git push origin HEAD:develop/extreme-features
