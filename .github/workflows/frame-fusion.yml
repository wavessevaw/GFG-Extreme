name: Frame Fusion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-22.04
    env:
      CXX: g++-12
      CC: gcc-12
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native dependencies and Vulkan software device
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libx11-dev libxcb1-dev glslang-tools spirv-tools p7zip-full
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
      - name: Build production renderer and run full CTest and pixel comparison
        run: |
          set -euo pipefail
          python3 scripts/build_frame_fusion.py --work "$RUNNER_TEMP/fusion" --headers "$RUNNER_TEMP/vkh/include" 2>&1 | tee frame-fusion-tests.log
      - name: Validate Vulkan synchronization
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          "$RUNNER_TEMP/fusion/build/mako-render/gfg-frame-fusion-tests" > fusion-validation.log 2>&1
          cat fusion-validation.log
          if grep -E 'Validation Error|SYNC-HAZARD|VUID-' fusion-validation.log; then exit 1; fi
      - name: Upload renderer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: frame-fusion-native
          path: |
            ${{ runner.temp }}/fusion/build/mako-render/libmako-render.so
            ${{ runner.temp }}/fusion/build/mako-render/libmako-render-scaling.so
            ${{ runner.temp }}/fusion/build/mako-cli/mako-cli
            ${{ runner.temp }}/fusion/build/mako-render/gfg-frame-fusion-tests
            frame-fusion-tests.log
            fusion-validation.log
