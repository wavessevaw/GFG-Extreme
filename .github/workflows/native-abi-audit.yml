name: Native ABI audit
on:
  push:
    branches: [develop/extreme-features]
    paths: [.github/workflows/native-abi-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  abi:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh run download 37908090427 -n gfg-open-x86_64 -D /tmp/gfg-abi
          readelf --version-info /tmp/gfg-abi/libmako-render.so > /tmp/gfg-versions
          python3 - <<'PY'
          import re
          data=open("/tmp/gfg-versions").read()
          for prefix in ("GLIBC","GLIBCXX"):
              matches=set(re.findall(r"\b"+prefix+r"_([0-9.]+)",data))
              versions=sorted(matches,key=lambda v:tuple(map(int,v.split("."))))
              print(prefix,versions)
          PY
