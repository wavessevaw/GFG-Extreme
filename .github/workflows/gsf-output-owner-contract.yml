name: GSF output-owner contract (experimental)

on:
  push:
    branches:
      - research/gsf-frame-output-owner-v0-20261017
  pull_request:
    branches:
      - fix/gsf-borrowed-physical-dispatch-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute actual C output-owner contract
        run: |
          make -C engine/gfg-native output-owner-contract
      - name: Guard against any accidental claim of real display validation
        run: |
          test -f engine/gfg-native/src/output_owner_queue.h
          test -f engine/gfg-native/tests/output_owner_queue.c
          grep -q "NO Vulkan consumer" engine/gfg-native/tests/output_owner_queue.c
      - name: Install Mesa Vulkan software WSI and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev libxcb1-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Compile and present identifiable probe frames through real Vulkan WSI
        run: |
          make -C engine/gfg-native output-visual-probe
          GFG_FOE_VISUAL_VERIFY=1 GFG_FOE_VISUAL_FRAMES=9 GFG_FOE_VISUAL_INTERVAL_MS=0 \
            xvfb-run -a engine/gfg-native/build/output-visual-probe 2>&1 | tee /tmp/foe-wsi-probe.txt
          test "$(grep -c 'WSI_accept frame=' /tmp/foe-wsi-probe.txt)" -eq 9
          grep -q 'frame=0 role=REAL_A color=red' /tmp/foe-wsi-probe.txt
          grep -q 'frame=1 role=TEST_MIDPOINT color=green' /tmp/foe-wsi-probe.txt
          grep -q 'frame=2 role=REAL_B color=blue' /tmp/foe-wsi-probe.txt
          grep -q 'GPU PIXEL READBACK: ALL REAL/MID/REAL TEST PATTERNS VERIFIED' /tmp/foe-wsi-probe.txt
