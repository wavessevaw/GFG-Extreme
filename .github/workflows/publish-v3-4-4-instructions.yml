name: Publish v3.4.4 benchmark instructions

on:
  push:
    branches: [main]
    paths:
      - RELEASE_DESCRIPTION_V3_4_4.md

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v3.4.4 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.4.4 --notes-file RELEASE_DESCRIPTION_V3_4_4.md
