name: Package the camera exposure test build
on:
  push:
    branches: [test/camera-exposure]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wavessevaw/GSF_Kedavra
          run-id: 45043796794
          name: gamescope-runtime
          path: runtime-build
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wavessevaw/GSF_Kedavra
          run-id: 45043796794
          name: kedavra-deck-bench
          path: bench-build
      - name: Backend regression tests and virtual Steam Deck scenarios
        run: |
          python3 -m unittest discover -s tests
          python3 -m sandbox.run
      - name: Build and verify the installation ZIP
        run: |
          test "$(cat runtime-build/VERSION)" = kedavra-1.8.1-turn.1-b74e611
          bash scripts/build_release.sh 3.6.1-turn.1 "$PWD/runtime-build" "$PWD/out" "$PWD/bench-build"
          cd out
          sha256sum -c SHA256SUMS.txt
          unzip -tq *.zip
          cmp <(unzip -p *.zip GFG-Extreme/runtime/bin/gamescope) ../runtime-build/bin/gamescope
          for asset in kfg_post.spv kfg_warp.spv kfg_select.spv kfg_stats.spv kfg_vktest; do
            cmp <(unzip -p *.zip "GFG-Extreme/bench/$asset") "../bench-build/$asset"
          done
          cmp <(unzip -p *.zip GFG-Extreme/bin/kfg_pacing.py) ../tools/kfg_pacing.py
          cmp <(unzip -p *.zip GFG-Extreme/py_modules/gfg_plugin/filter_budget.py) ../py_modules/gfg_plugin/filter_budget.py
          unzip -Z1 *.zip > "$RUNNER_TEMP/manifest.txt"
          if grep -E '(^|/)(__pycache__|tests|sandbox|node_modules|\.git|audit-v3\.0\.0)(/|$)|\.pyc$' "$RUNNER_TEMP/manifest.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: GFG-Extreme-Turn-Candidate
          path: out/
