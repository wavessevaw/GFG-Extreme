name: GFG Native FG hardware-trial pre-release

on:
  push:
    branches: [feat/gfg-native-independent-backend]
    paths: [.github/beta/native-fg.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gfg-native-hardware-trial
  cancel-in-progress: false

jobs:
  device-trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CXX: g++-12
      CC: gcc-12
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate unique pre-release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open(".github/beta/native-fg.json"))["version"])')"
          [[ "$version" =~ ^2\.1\.2-native\.[0-9]+$ ]] || {
            echo "::error::Native test version must be 2.1.2-native.N"; exit 1;
          }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Source and protocol regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_native_layer_foundation.py -v
          python3 -m unittest discover -s tests -p test_native_no_dll_bootstrap.py -v

      - name: Pinned Vulkan headers, Mesa Vulkan and shader tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake libvulkan-dev mesa-vulkan-drivers \
            vulkan-validationlayers libx11-dev libxcb1-dev xvfb glslang-tools \
            spirv-tools binutils
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.4.365 \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"

      - name: Compile original open-source Temporal Engine TE8
        run: |
          set -euo pipefail
          make -C engine/gfg-temporal all lib
          engine/gfg-temporal/build/te-tests

      - name: Compile independent Vulkan layer with TE8 linked inside
        run: |
          set -euo pipefail
          make -C engine/gfg-native layer ENABLE_TE=1 BUILD=build-te \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include"
          make -C engine/gfg-native build-te/wsi-smoke ENABLE_TE=1 BUILD=build-te \
            WSI_EXTRA_CFLAGS=-DGFG_NATIVE_TEST_SMALL \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include"
          readelf -d engine/gfg-native/build-te/libVkLayer_gfg_native.so | tee dependencies.txt
          if grep -Ei 'NEEDED.*(mako|lossless|lsfg)' dependencies.txt; then
            echo "::error::Non-independent runtime dependency"; exit 1
          fi

      - name: Demonstrate genuinely distinct synthetic Vulkan-present frame
        run: |
          set -euo pipefail
          xvfb-run -a make -C engine/gfg-native wsi-smoke-te \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" 2>&1 | tee native-wsi-evidence.log
          grep -q '\[gfg-native\] OWN TE8 CPU bridge active' native-wsi-evidence.log
          grep -Eq '\[gfg-native\] generated=[1-9]' native-wsi-evidence.log
          grep -q '\[gfg-native\] candidate distinct=1' native-wsi-evidence.log
          grep -q 'GFG native: 4 real WSI acquire/submit/present cycles PASS' native-wsi-evidence.log

      - name: Produce installable native-only archive with GPL source
        run: |
          set -euo pipefail
          python3 scripts/package_native_fg.py \
            --binary engine/gfg-native/build-te/libVkLayer_gfg_native.so \
            --outdir out-native --version "${{ steps.version.outputs.version }}"
          ( cd out-native && sha256sum --check SHA256SUMS.txt )
          unzip -tq out-native/*.zip

      - name: Install and run the ACTUAL archive with no MAKO or DLL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-stage" "$RUNNER_TEMP/native-home"
          unzip -q out-native/*.zip -d "$RUNNER_TEMP/native-stage"
          cd "$RUNNER_TEMP/native-stage/GFG-Native-FG"
          sha256sum --check SHA256SUMS.txt
          HOME="$RUNNER_TEMP/native-home" bash ./install.sh
          test -x "$RUNNER_TEMP/native-home/.local/bin/gfg-native"
          GFG_NATIVE_ALGO=tiles GFG_NATIVE_BUDGET_MS=5000 GFG_NATIVE_TRACE=1 \
          HOME="$RUNNER_TEMP/native-home" \
            xvfb-run -a "$RUNNER_TEMP/native-home/.local/bin/gfg-native" \
            "$GITHUB_WORKSPACE/engine/gfg-native/build-te/wsi-smoke" \
            2>&1 | tee "$GITHUB_WORKSPACE/native-installed-evidence.log"
          grep -q '\[gfg-native\] candidate distinct=1' "$GITHUB_WORKSPACE/native-installed-evidence.log"
          grep -Eq '\[gfg-native\] generated=[1-9]' "$GITHUB_WORKSPACE/native-installed-evidence.log"
          HOME="$RUNNER_TEMP/native-home" bash ./uninstall.sh
          test ! -e "$RUNNER_TEMP/native-home/.local/bin/gfg-native"

      - name: Preserve binary, source, exact tests and checksums
        uses: actions/upload-artifact@v4
        with:
          name: GFG-Native-FG-${{ steps.version.outputs.version }}
          path: |
            out-native/*.zip
            out-native/SHA256SUMS.txt
            native-wsi-evidence.log
            native-installed-evidence.log
            dependencies.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish explicit opt-in hardware-trial pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            out-native/*.zip out-native/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "GFG Native FG ${{ steps.version.outputs.version }} (Steam Deck hardware trial)" \
            --notes-file .github/beta/native-fg.md
