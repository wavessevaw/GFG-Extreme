name: Restore GTA VI goal in v3.4.4 notes

on:
  push:
    branches: [main]
    paths:
      - RELEASE_DESCRIPTION_V3_4_4.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release v3.4.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.4.4 --notes-file RELEASE_DESCRIPTION_V3_4_4.md
