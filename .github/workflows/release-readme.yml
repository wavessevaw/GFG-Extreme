name: Update English release README
on:
  push:
    branches: ['docs/release-notes-en']
    paths: ['RELEASE_DESCRIPTION_V3_3_0.md', '.github/workflows/release-readme.yml']
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release text and README only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.3.0
          cp 'RELEASE_DESCRIPTION_V3_3_0.md' README-3.3.0.md
          gh release edit v3.3.0 --notes-file 'RELEASE_DESCRIPTION_V3_3_0.md'
          gh release upload v3.3.0 README-3.3.0.md --clobber
