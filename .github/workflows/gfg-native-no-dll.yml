name: FG3 internal GPU validation (not hardware acceptance)
on:
  pull_request:
    paths:
      - 'engine/gfg-native/**'
      - 'engine/gfg-temporal/**'
      - 'scripts/package_native_fg.py'
      - 'tests/test_native*.py'
      - '.github/workflows/gfg-native-no-dll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libxcb1-dev xvfb glslang-tools spirv-tools
          git clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
      - name: Portable contracts and native core
        run: |
          python3 -m unittest discover -s tests -p 'test_native*.py' -v
          make -C engine/gfg-temporal all lib
          engine/gfg-temporal/build/te-tests 2>&1 | tee core.log
          make -C engine/gfg-native ENABLE_TE=1 BUILD=build-gpu VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" layer build-gpu/wsi-smoke build-gpu/borrowed-device build-gpu/gpu-wsi-observer build-gpu/gpu-wsi-stress build-gpu/gpu-wsi-recreate build-gpu/gpu-wsi-resume build-gpu/gpu-wsi-observer-800
      - name: Validate GPU pixels, WSI and asynchronous reuse
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -euo pipefail
          engine/gfg-native/build-gpu/borrowed-device 2>&1 | tee borrowed.log
          xvfb-run -a engine/gfg-native/build-gpu/gpu-wsi-observer 2>&1 | tee observer.log
          GFG_NATIVE_TEST_SRGB=1 xvfb-run -a engine/gfg-native/build-gpu/gpu-wsi-observer 2>&1 | tee observer-srgb.log
          grep -q 'synthetic=6 content=PASS handoff_order=PASS' observer.log
          grep -q 'synthetic=6 content=PASS handoff_order=PASS' observer-srgb.log
          xvfb-run -a -s '-screen 0 1280x800x24' engine/gfg-native/build-gpu/gpu-wsi-observer-800 2>&1 | tee observer-800.log
          grep -q 'synthetic=6 content=PASS handoff_order=PASS' observer-800.log
          for order in VK_LAYER_GFG_native:VK_LAYER_KHRONOS_validation VK_LAYER_KHRONOS_validation:VK_LAYER_GFG_native; do
            GFG_NATIVE_FG=1 GFG_NATIVE_GPU=1 VK_INSTANCE_LAYERS="$order" VK_LAYER_PATH="$GITHUB_WORKSPACE/engine/gfg-native/build-gpu:$VK_LAYER_PATH" xvfb-run -a engine/gfg-native/build-gpu/gpu-wsi-stress 2>&1 | tee "stress-$order.log"
            grep -q 'real_calls=300 submitted_outputs=598 gpu_completed=598 present_handoffs=598 bypasses=0' "stress-$order.log"
            GFG_NATIVE_FG=1 GFG_NATIVE_GPU=1 VK_INSTANCE_LAYERS="$order" VK_LAYER_PATH="$GITHUB_WORKSPACE/engine/gfg-native/build-gpu:$VK_LAYER_PATH" xvfb-run -a engine/gfg-native/build-gpu/gpu-wsi-recreate 2>&1 | tee "recreate-$order.log"
            grep -q '12 real WSI acquire/submit/present cycles PASS' "recreate-$order.log"
            GFG_NATIVE_FG=1 GFG_NATIVE_GPU=1 VK_INSTANCE_LAYERS="$order" VK_LAYER_PATH="$GITHUB_WORKSPACE/engine/gfg-native/build-gpu:$VK_LAYER_PATH" xvfb-run -a engine/gfg-native/build-gpu/gpu-wsi-resume 2>&1 | tee "resume-$order.log"
            grep -q 'real_calls=3 submitted_outputs=2 gpu_completed=2 present_handoffs=2 bypasses=0' "resume-$order.log"
          done
          if grep -E 'Validation Error|VUID-' borrowed.log observer*.log stress-*.log recreate-*.log resume-*.log; then exit 1; fi
      - name: Validate private artifact installation and rollback
        run: |
          python3 scripts/package_native_fg.py --binary engine/gfg-native/build-gpu/libVkLayer_gfg_native.so --outdir "$RUNNER_TEMP/fg3-internal"
          (cd "$RUNNER_TEMP/fg3-internal" && sha256sum --check SHA256SUMS.txt)
          mkdir -p "$RUNNER_TEMP/fg3-stage" "$RUNNER_TEMP/fg3-home"
          unzip -q "$RUNNER_TEMP"/fg3-internal/*.zip -d "$RUNNER_TEMP/fg3-stage"
          cd "$RUNNER_TEMP/fg3-stage/GFG-Native-FG"
          HOME="$RUNNER_TEMP/fg3-home" bash install.sh
          HOME="$RUNNER_TEMP/fg3-home" "$RUNNER_TEMP/fg3-home/.local/bin/gfg-native" /bin/true
          HOME="$RUNNER_TEMP/fg3-home" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation xvfb-run -a "$RUNNER_TEMP/fg3-home/.local/bin/gfg-native" "$GITHUB_WORKSPACE/engine/gfg-native/build-gpu/gpu-wsi-stress" 2>&1 | tee installed.log
          grep -q 'real_calls=300 submitted_outputs=598 gpu_completed=598 present_handoffs=598 bypasses=0' installed.log
          if grep -E 'Validation Error|VUID-' installed.log; then exit 1; fi
          HOME="$RUNNER_TEMP/fg3-home" bash rollback.sh
          make -C SOURCE/engine/gfg-temporal -j2 BUILD="$RUNNER_TEMP/fg3-source-core" lib
          make -C SOURCE/engine/gfg-native ENABLE_TE=1 BUILD="$RUNNER_TEMP/fg3-source-native" TE_LIB="$RUNNER_TEMP/fg3-source-core/libgfg-temporal.a" VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" layer
          cmp libVkLayer_gfg_native.so "$RUNNER_TEMP/fg3-source-native/libVkLayer_gfg_native.so"
      # No release creation, tag, public binary upload or device-success claim.
