name: Native FG3 GPU validation (software only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_LAYER_PATH: /usr/share/vulkan/explicit_layer.d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libxcb1-dev xvfb glslang-tools spirv-tools
          git clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
      - name: Core and native contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_native*.py' -v
          make -C engine/gfg-temporal all lib
          engine/gfg-temporal/build/te-tests 2>&1 | tee core.log
          make -C engine/gfg-native ENABLE_TE=1 BUILD=build-te VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" layer build-te/wsi-gpu-smoke build-te/borrowed-device build-te/gpu-wsi-observer swapchain-policy memory-policy present-ids
      - name: Borrowed device, actual WSI image contents and sync validation
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -euo pipefail
          engine/gfg-native/build-te/borrowed-device 2>&1 | tee borrowed.log
          xvfb-run -a engine/gfg-native/build-te/gpu-wsi-observer 2>&1 | tee observer.log
          GFG_NATIVE_TEST_SRGB=1 xvfb-run -a engine/gfg-native/build-te/gpu-wsi-observer 2>&1 | tee observer-srgb.log
          grep -q 'synthetic=6 content=PASS handoff_order=PASS' observer.log
          grep -q 'synthetic=6 content=PASS handoff_order=PASS' observer-srgb.log
          for order in VK_LAYER_GFG_native:VK_LAYER_KHRONOS_validation VK_LAYER_KHRONOS_validation:VK_LAYER_GFG_native; do
            GFG_NATIVE_FG=1 GFG_NATIVE_GPU_BRIDGE=1 GFG_NATIVE_GPU_SYNC=same-device GFG_NATIVE_ALGO=tiles GFG_TEST_EXPECT_GPU=1 GFG_TEST_VALIDATION=1 GFG_TEST_FRAMES=120 GFG_NATIVE_GPU_BRIDGE_VERIFY=1 GFG_NATIVE_GPU_BRIDGE_VERIFY_EVERY=4 VK_INSTANCE_LAYERS="$order" VK_LAYER_PATH="$GITHUB_WORKSPACE/engine/gfg-native/build-te:$VK_LAYER_PATH" xvfb-run -a engine/gfg-native/build-te/wsi-gpu-smoke 2>&1 | tee "gpu-$order.log"
            grep -q 'validation errors=0' "gpu-$order.log"
            grep -q 'real=120 synthetic=238 skipped=0' "gpu-$order.log"
            GFG_NATIVE_FG=1 GFG_NATIVE_GPU_BRIDGE=1 GFG_NATIVE_GPU_SYNC=same-device GFG_NATIVE_ALGO=tiles GFG_TEST_EXPECT_GPU=1 GFG_TEST_VALIDATION=1 GFG_TEST_FRAMES=30 GFG_NATIVE_GPU_BRIDGE_INJECT_SKIP=5 GFG_TEST_ALLOW_SKIPS=1 VK_INSTANCE_LAYERS="$order" VK_LAYER_PATH="$GITHUB_WORKSPACE/engine/gfg-native/build-te:$VK_LAYER_PATH" xvfb-run -a engine/gfg-native/build-te/wsi-gpu-smoke 2>&1 | tee "skip-$order.log"
            grep -q 'validation errors=0' "skip-$order.log"
          done
          if grep -E 'VALIDATION ERROR|Validation Error|VUID-' borrowed.log observer*.log gpu-*.log skip-*.log; then exit 1; fi
      # Intentionally no patch/ZIP artifact upload, prerelease, or hardware claim.
