name: GFG Native TE no-DLL bootstrap
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native bootstrap contract tests
        run: |
          python3 -m unittest discover -s tests -p test_native_no_dll_bootstrap.py -v
          python3 -m unittest discover -s tests -p test_native_layer_foundation.py -v

  native-bootstrap:
    runs-on: ubuntu-22.04
    env:
      CXX: g++-12
      CC: gcc-12
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libx11-dev libxcb1-dev xvfb glslang-tools spirv-tools p7zip-full
          git -c advice.detachedHead=false clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
      - name: Compile standalone GFG Native WSI layer (no MAKO linkage)
        run: |
          make -C engine/gfg-native layer VULKAN_HEADERS="$RUNNER_TEMP/vkh/include"
          test -s engine/gfg-native/build/libVkLayer_gfg_native.so
          make -C engine/gfg-native smoke VULKAN_HEADERS="$RUNNER_TEMP/vkh/include"             VK_ICD_FILENAMES="$VK_ICD_FILENAMES" 2>&1 | tee native-loader-smoke.log
          grep -q 'GFG native: Vulkan loader/instance/device dispatch smoke PASS' native-loader-smoke.log
          grep -q '\[gfg-native\] instance initialized enabled=1' native-loader-smoke.log
          xvfb-run -a make -C engine/gfg-native wsi-smoke \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" 2>&1 | tee native-wsi-smoke.log
          grep -q 'GFG native: 4 real WSI acquire/submit/present cycles PASS' native-wsi-smoke.log
      - name: Build and exercise OWN TE8 frame generation with no DLL or MAKO
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          make -C engine/gfg-temporal lib
          xvfb-run -a make -C engine/gfg-native wsi-smoke-te \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" 2>&1 | tee native-fg-wsi.log
          grep -q '\[gfg-native\] OWN TE8 CPU bridge active' native-fg-wsi.log
          grep -Eq '\[gfg-native\] generated=[1-9]' native-fg-wsi.log
          grep -Eq '\[gfg-native\] candidate distinct=1' native-fg-wsi.log
          grep -q 'GFG native: 4 real WSI acquire/submit/present cycles PASS' native-fg-wsi.log
          GFG_NATIVE_TEST_SRGB=1 xvfb-run -a make -C engine/gfg-native wsi-smoke-te \
            VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" 2>&1 | tee native-fg-wsi-srgb.log
          grep -q 'GFG native: WSI SRGB format=' native-fg-wsi-srgb.log
          grep -q 'candidate=1 output=real-only reason=accepted' native-fg-wsi-srgb.log
          grep -Eq '\[gfg-native\] candidate distinct=1' native-fg-wsi-srgb.log
          grep -Eq '\[gfg-native\] generated=[1-9]' native-fg-wsi-srgb.log
      - name: Package independent Steam Deck test build and verify installation
        run: |
          python3 scripts/package_native_fg.py \
            --binary engine/gfg-native/build-te/libVkLayer_gfg_native.so \
            --outdir out-native --version 2.1.2-native.1
          ( cd out-native && sha256sum --check SHA256SUMS.txt )
          archive="$(find out-native -maxdepth 1 -name '*.zip' -print -quit)"
          test -s "$archive"
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/native-stage" "$RUNNER_TEMP/native-home"
          unzip -q "$archive" -d "$RUNNER_TEMP/native-stage"
          (
            cd "$RUNNER_TEMP/native-stage/GFG-Native-FG"
            sha256sum --check SHA256SUMS.txt
            HOME="$RUNNER_TEMP/native-home" bash ./install.sh
            test -s "$RUNNER_TEMP/native-home/.local/share/gfg-native/libVkLayer_gfg_native.so"
            HOME="$RUNNER_TEMP/native-home" "$RUNNER_TEMP/native-home/.local/bin/gfg-native" /bin/true
            HOME="$RUNNER_TEMP/native-home" bash ./uninstall.sh
            test ! -e "$RUNNER_TEMP/native-home/.local/bin/gfg-native"
          )
      - name: Compile DLL-free Temporal Engine bootstrap using pinned production renderer
        run: |
          python3 scripts/build_frame_fusion.py --native-no-dll \
            --work "$RUNNER_TEMP/gfg-native-bridge" \
            --headers "$RUNNER_TEMP/vkh/include"
          python3 scripts/check_native_independence.py \
            --source "$RUNNER_TEMP/gfg-native-bridge/source"
      - name: Provenance, no release
        run: |
          echo 'This validates a no-DLL TE bootstrap within the transitional GPL MAKO WSI.'
          echo 'It does NOT validate an independent WSI or physical Steam Deck presentation.'

      - name: Preserve independent device-trial archive
        uses: actions/upload-artifact@v4
        with:
          name: GFG-Native-FG-2.1.2-native.1
          path: |
            out-native/*.zip
            out-native/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
